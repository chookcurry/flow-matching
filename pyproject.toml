[project]
name = "diffusion"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Max Burzer", email = "maxi.burzer@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "aim>=3.29.1",
    "certifi>=2025.10.5",
    "hydra-core>=1.3.2",
    "hydra-joblib-launcher>=1.2.0",
    "hydra-submitit-launcher>=1.2.0",
    "ipykernel>=6.29.5",
    "matplotlib>=3.10.3",
    "python-dotenv>=1.1.1",
    "scikit-learn>=1.7.0",
    "seaborn>=0.13.2",
    "setuptools>=80.9.0",
    "torch>=2.7.1",
    "torchvision>=0.22.1",
    "tqdm>=4.67.1",
    "types-seaborn>=0.13.2.20250516",
    "types-tqdm>=4.67.0.20250516",
    "umap-learn>=0.5.9.post2",
    "wandb>=0.21.3",
    "whar-datasets",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv.sources]
whar-datasets = { git = "https://github.com/teco-kit/whar-datasets.git" }
